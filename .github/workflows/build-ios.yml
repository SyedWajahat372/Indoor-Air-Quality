name: Build MAUI iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode 16.1
      run: |
        sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
        xcodebuild -version

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install MAUI Workloads
      run: |
        sudo dotnet workload install maui --source https://api.nuget.org/v3/index.json

    - name: Build iOS App Bundle
      run: |
        dotnet build "Air Quality/Air_Quality.csproj" -f net9.0-ios -c Release -r iossimulator-arm64 -p:SingleTarget=true

    - name: Package IPA for Sideloadly
      run: |
        cd "Air Quality/bin/Release/net9.0-ios/iossimulator-arm64"
        mkdir -p Payload
        cp -r Air_Quality.app Payload/
        zip -r Air_Quality.ipa Payload
        mv Air_Quality.ipa ../

    - name: Upload iOS App Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Air_Quality_iOS_App
        path: |
          Air Quality/bin/Release/net9.0-ios/*.ipa
          Air Quality/bin/Release/net9.0-ios/**
