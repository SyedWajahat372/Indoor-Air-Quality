name: Build MAUI iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore MAUI Workloads
      run: |
        sudo dotnet workload restore "Air Quality/Air_Quality.csproj" --source https://api.nuget.org/v3/index.json

    - name: Build iOS App
      run: |
        dotnet build "Air Quality/Air_Quality.csproj" -f net9.0-ios -c Release

    - name: Upload iOS App Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Air_Quality_iOS_Build
        path: Air Quality/bin/Release/net9.0-ios/**
