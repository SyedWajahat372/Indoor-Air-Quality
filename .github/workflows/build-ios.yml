name: Build MAUI iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode 16.1
      run: |
        sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
        xcodebuild -version

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install MAUI Workloads
      run: |
        sudo dotnet workload install maui --source https://api.nuget.org/v3/index.json

    - name: Build iOS App Bundle
      run: |
        dotnet build "Air Quality/Air_Quality.csproj" -f net9.0-ios -c Release -r ios-arm64 -p:EnableCodeSigning=false -p:CodesignKey="" -p:CodesignProvision="" || dotnet build "Air Quality/Air_Quality.csproj" -f net9.0-ios -c Release -r iossimulator-arm64 -p:EnableCodeSigning=false

    - name: Package IPA for Sideloadly
      run: |
        APP_PATH=$(find "Air Quality/bin/Release/net9.0-ios" -name "*.app" -type d | head -n 1)
        echo "Found app at: $APP_PATH"
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r Air_Quality.ipa Payload
        mkdir -p "Air Quality/bin/Release/net9.0-ios/output"
        mv Air_Quality.ipa "Air Quality/bin/Release/net9.0-ios/output/"

    - name: Upload iOS App Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Air_Quality_iOS_App
        path: |
          Air Quality/bin/Release/net9.0-ios/output/*.ipa
