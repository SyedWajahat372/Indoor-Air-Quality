name: Build MAUI iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode 16.1
      run: |
        sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
        xcodebuild -version

    - name: Setup .NET 9.0 (Stable SDK)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.200'

    - name: Install All MAUI Workloads
      run: |
        sudo dotnet workload install maui-ios maui-android --source https://api.nuget.org/v3/index.json

    - name: Build iOS App
      run: |
        dotnet build "Air Quality/Air_Quality.csproj" -f net9.0-ios -c Release -p:SingleTarget=true -p:EnableCodeSigning=false -p:IosSdkVersion=18.0

    - name: Upload iOS App Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Air_Quality_iOS_Build
        path: Air Quality/bin/Release/net9.0-ios/**
