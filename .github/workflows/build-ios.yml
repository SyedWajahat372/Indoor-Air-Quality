name: Build MAUI iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install MAUI iOS Workload
      run: dotnet workload install maui-ios

    - name: Build & Publish iOS App
      run: |
        dotnet publish "Air Quality/Air_Quality.csproj" -f net9.0-ios -c Release

    - name: Upload iOS App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Air_Quality_iOS
        path: Air Quality/bin/Release/net9.0-ios/**
