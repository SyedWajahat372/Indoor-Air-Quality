name: Build MAUI iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode 16.1
      run: |
        sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
        xcodebuild -version

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install MAUI Workloads
      run: |
        sudo dotnet workload install maui --source https://api.nuget.org/v3/index.json

    - name: Build iOS App Bundle
      run: |
        dotnet publish "Air Quality/Air_Quality.csproj" -f net9.0-ios -c Release -r ios-arm64 -p:SingleTarget=true -p:EnableCodeSigning=false -p:BuildIpa=true -p:ServerAddress=""

    - name: Package IPA Backup for Sideloadly
      run: |
        cd "Air Quality/bin/Release/net9.0-ios/ios-arm64"
        if [ -d "publish" ]; then cd publish; fi
        mkdir -p Payload
        if [ -d "Air_Quality.app" ]; then cp -r Air_Quality.app Payload/; fi
        zip -r Air_Quality_Manual.ipa Payload
        mv Air_Quality_Manual.ipa ../

    - name: Upload iOS App Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Air_Quality_iOS_App
        path: |
          Air Quality/bin/Release/net9.0-ios/ios-arm64/*.ipa
          Air Quality/bin/Release/net9.0-ios/*.ipa
          Air Quality/bin/Release/net9.0-ios/ios-arm64/publish/*.ipa
